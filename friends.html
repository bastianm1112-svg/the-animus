<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Friends and activity on ANIMUS.">
<meta property="og:title" content="ANIMUS — Friends">
<meta property="og:description" content="Connect with others and compare personality profiles.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://animustest.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://animustest.com/friends">
<title>ANIMUS — Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/animus-shared.js"></script>
<script>
AnimusShared.initFirebaseApp(AnimusShared.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();
</script>
<link rel="stylesheet" href="/css/animus-shell.css?v=20260603">
<link rel="stylesheet" href="/style.css?v=20260603">
<link rel="stylesheet" href="/css/animus-release.css?v=20260603">
<link rel="stylesheet" href="/css/animus-home.css?v=20260603">
<link rel="stylesheet" href="/css/animus-premium.css?v=20260603">
<script src="/js/animus-safe.js"></script>
<script src="/js/animus-seo.js"></script>
<script src="/js/animus-app.js" defer></script>
</head>
<body class="has-app-nav">
<script>(function(){try{if(localStorage.getItem('animus_theme')==='light')document.body.classList.add('light-mode');}catch(e){}})();</script>
<a href="#main-content" class="skip-link">Skip to content</a>

<div id="appNavMount"></div>

<main class="member-home friends-page app-page" id="main-content">
  <header class="home-header animus-reveal">
    <h1 class="home-greeting friends-page-title">Friends</h1>
    <p class="home-date friends-page-sub">Connect with others and compare profiles.</p>
  </header>

  <section id="member-friends" class="app-section animus-reveal animus-reveal-delay-1">
    <div class="home-section-head">
      <span class="home-section-title">Your friends</span>
      <button type="button" class="home-section-link" onclick="AnimusSocial.openAddFriend()">+ Add friend</button>
    </div>
    <div class="friends-grid" id="friendsGrid">
      <div class="empty-state">No friends yet — add someone to compare profiles</div>
    </div>
  </section>

  <section id="member-activity" class="app-section animus-reveal animus-reveal-delay-2">
    <div class="home-section-head"><span class="home-section-title">Recent activity</span></div>
    <div class="feed-items" id="feedItems">
      <div class="empty-state" style="grid-column:1/-1">Activity from friends will appear here</div>
    </div>
  </section>
</main>

<div id="addFriendModal" class="modal-overlay">
  <div class="modal-box">
    <button type="button" class="modal-close" onclick="AnimusSocial.closeAddFriend()" aria-label="Close">&times;</button>
    <div class="modal-title">Add a friend</div>
    <p class="modal-sub">Search by username to find someone on ANIMUS.</p>
    <div class="modal-search-wrap">
      <span class="modal-search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input type="search" id="friendSearchInput" placeholder="Search @username…" maxlength="64" autocomplete="off" />
    </div>
    <div class="search-results" id="searchResults"><div class="search-empty">Start typing to search</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="appBottomMount"></div>
<script src="/js/animus-social.js"></script>
<script src="/js/animus-nav.js"></script>
<script src="/js/animus-friends-page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  AnimusNav.mountTop('appNavMount', 'friends');
  AnimusNav.mountBottom('appBottomMount', 'friends');
  if (typeof AnimusFriendsPage !== 'undefined') AnimusFriendsPage.boot(auth, db);
});
</script>
</body>
</html>
