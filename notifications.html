<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Friend requests and account updates on ANIMUS.">
<meta property="og:title" content="ANIMUS — Notifications">
<meta property="og:description" content="Friend requests and updates for your ANIMUS account.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://animustest.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://animustest.com/notifications">
<title>ANIMUS — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/animus-shared.js"></script>
<script>
AnimusShared.initFirebaseApp(AnimusShared.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();
</script>
<link rel="stylesheet" href="/css/animus-shell.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/animus-release.css">
<link rel="stylesheet" href="/css/animus-notifications.css">
<link rel="stylesheet" href="/css/animus-premium.css?v=20260608">
<link rel="stylesheet" href="/css/animus-app-shell.css?v=20260608">
<script src="/js/animus-safe.js"></script>
<script src="/js/animus-seo.js"></script>
<script src="/js/animus-page-shell.js?v=20260608"></script>
<script src="/js/animus-app.js" defer></script>
</head>
<body class="has-app-nav">
<script>(function(){try{if(localStorage.getItem('animus_theme')==='light')document.body.classList.add('light-mode');}catch(e){}})();</script>
<a href="#main-content" class="skip-link">Skip to content</a>

<div id="appNavMount"></div>

<main class="notifications-page app-page" id="main-content">
  <header class="app-page-head animus-reveal">
    <p class="animus-page-eyebrow">Inbox</p>
    <h1 class="app-page-title notifications-title">Notifications</h1>
    <p class="app-page-sub notifications-sub">Friend requests and updates for your account.</p>
  </header>
  <div class="notif-page-list" id="notifPageList">
    <div class="notif-page-empty">Loading…</div>
  </div>
</main>

<div class="toast" id="toast"></div>
<div id="appFooterMount"></div>
<div id="appBottomMount"></div>

<script src="/js/animus-social.js"></script>
<script src="/js/animus-nav.js"></script>
<script src="/js/animus-notifications-page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  AnimusNav.mountTop('appNavMount', 'notifications');
  AnimusNav.mountBottom('appBottomMount', 'notifications');
  if (typeof AnimusNotificationsPage !== 'undefined') {
    AnimusNotificationsPage.boot(auth, db);
  }
});
</script>
</body>
</html>
