<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Shop — ANIMUS assessments and Plus subscription.">
<title>ANIMUS — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/animus-shared.js"></script>
<script src="/js/animus-entitlements.js"></script>
<script>
AnimusShared.initFirebaseApp(AnimusShared.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();
</script>
<link rel="stylesheet" href="/css/animus-shell.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/animus-release.css">
<link rel="stylesheet" href="/css/animus-shop.css">
<script src="/js/animus-app.js" defer></script>
</head>
<body class="has-app-nav">
<script>(function(){try{if(localStorage.getItem('animus_theme')==='light')document.body.classList.add('light-mode');}catch(e){}})();</script>
<a href="#main-content" class="skip-link">Skip to content</a>

<div id="appNavMount"></div>

<main class="shop-page" id="main-content">
  <h1 class="shop-title">Shop</h1>
  <p class="shop-sub">Unlock deeper assessments, profile estimation, and unlimited compares.</p>
  <p class="shop-plus-status" id="shopPlusStatus">Loading your plan…</p>
  <div class="shop-grid" id="shopGrid"></div>
</main>

<div class="toast" id="toast"></div>
<div id="appBottomMount"></div>

<script src="/js/animus-shop.js"></script>
<script src="/js/animus-nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  AnimusNav.mountTop('appNavMount', 'shop');
  AnimusNav.mountBottom('appBottomMount', 'shop');
  if (typeof AnimusShop !== 'undefined') AnimusShop.boot(auth, db);
});
</script>
</body>
</html>
