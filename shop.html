<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Shop — ANIMUS assessments and Plus subscription.">
<meta property="og:title" content="ANIMUS — Shop">
<meta property="og:description" content="Unlock detailed test, behavioral estimator, and Animus Plus.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://animustest.com/og-image.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://animustest.com/shop">
<title>ANIMUS — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/js/animus-shared.js"></script>
<script src="/js/animus-entitlements.js"></script>
<script>
AnimusShared.initFirebaseApp(AnimusShared.FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();
</script>
<link rel="stylesheet" href="/css/animus-shell.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/animus-release.css">
<link rel="stylesheet" href="/css/animus-shop.css">
<link rel="stylesheet" href="/css/animus-plus.css">
<link rel="stylesheet" href="/css/animus-premium.css">
<script src="/js/animus-safe.js"></script>
<script src="/js/animus-seo.js"></script>
<script src="/js/animus-app.js" defer></script>
</head>
<body class="has-app-nav">
<script>(function(){try{if(localStorage.getItem('animus_theme')==='light')document.body.classList.add('light-mode');}catch(e){}})();</script>
<a href="#main-content" class="skip-link">Skip to content</a>

<div id="appNavMount"></div>

<main class="shop-page" id="main-content">
  <h1 class="shop-title animus-reveal">Shop</h1>
  <p class="shop-sub">Unlock deeper assessments, profile estimation, and Animus Plus — unlimited compares, group compare, XP boost, career guides, and more.</p>
  <p class="shop-plus-status is-loading" id="shopPlusStatus">Loading your plan…</p>
  <p class="shop-checkout-banner" id="shopCheckoutBanner" hidden></p>
  <div class="shop-grid" id="shopGrid"></div>
</main>

<div class="toast" id="toast"></div>
<div id="appBottomMount"></div>

<script src="/js/animus-shop.js"></script>
<script src="/js/animus-nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  AnimusNav.mountTop('appNavMount', 'shop');
  AnimusNav.mountBottom('appBottomMount', 'shop');
  if (typeof AnimusShop !== 'undefined') {
    AnimusShop.boot(auth, db);
    auth.onAuthStateChanged(function (u) {
      if (u && AnimusShop.handleCheckoutReturn) AnimusShop.handleCheckoutReturn();
    });
  }
});
</script>
</body>
</html>
